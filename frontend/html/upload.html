<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alovre - Upload</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div id="navbar-container"></div>

<main class="container">
    <section class="card">
        <h2 class="card-title">Upload Content</h2>

        <div class="input-group">
            <label for="content-name">Content Name</label>
            <input type="text" id="content-name" placeholder="Enter a name for your content...">
            <span id="name-error" class="error-text hidden">Please provide a name for your content first.</span>
        </div>

        <div class="input-group">
            <label for="select-language">Content Language</label>
            <div class="language-select-wrapper upload-select">
                <i data-lucide="globe" class="select-icon"></i>
                <select id="select-language" class="language-select">
                    <option value="English">English</option>
                    <option value="Spanish">Spanish</option>
                    <option value="German">German</option>
                    <option value="French">French</option>
                    <option value="Italian">Italian</option>
                    <option value="Portuguese">Portuguese</option>
                    <option value="Turkish">Turkish</option>
                </select>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="document">
                <i data-lucide="file-text"></i> Document
            </button>
            <button class="tab" data-tab="plaintext">
                <i data-lucide="align-left"></i> Plain Text
            </button>
        </div>

        <div id="upload-document-section">
            <input type="file" id="file-upload" class="hidden" accept=".pdf,.txt">

            <div class="dropzone" id="dropzone">
                <i data-lucide="upload" class="upload-icon"></i>
                <p>Click to upload or drag and drop</p>
                <span class="file-hint">PDF, TXT files</span>
            </div>

            <div id="file-preview" class="hidden" style="display: flex; align-items: center; justify-content: space-between; padding: 1.25rem; border: 1px solid var(--border); border-radius: 1.25rem; background-color: var(--input-background); margin-top: 1rem;">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <i data-lucide="file-text" style="color: var(--primary);"></i>
                    <span id="file-name-display" style="font-weight: 500; color: var(--foreground);"></span>
                </div>
                <button id="remove-file-btn" class="icon-btn" style="color: var(--destructive); background-color: var(--card);" title="Remove file">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <button id="upload-document-btn" class="btn-primary" disabled style="margin-top: 1rem;">
                <i data-lucide="upload-cloud"></i> Upload Document
            </button>
        </div>

        <div id="upload-text-section" class="hidden">
            <div class="input-group" style="margin-bottom: 0;">
                <textarea id="text-input" placeholder="Type or paste your plain text here..." rows="6"></textarea>
                <span id="text-error" class="error-text hidden">Please enter some text before uploading.</span>
            </div>
            <button id="upload-text-btn" class="btn-primary" disabled>
                <i data-lucide="upload-cloud"></i> Upload Text
            </button>
        </div>
    </section>
</main>

<div id="toast-container" class="toast-wrapper hidden">
    <div id="toast-message" class="toast"></div>
</div>

<script src="../js/common.js"></script>
<script src="../js/upload.js"></script>
</body>
</html>
