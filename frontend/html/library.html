<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alovre - Library</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<nav class="navbar">
    <a href="index.html" class="logo">
        <i data-lucide="book-open" class="icon-brand"></i>
        <span>alovre</span>
    </a>
    <div class="nav-actions">
        <a href="upload.html" class="nav-btn"><i data-lucide="upload"></i> Upload</a>
        <a href="library.html" class="nav-btn"><i data-lucide="library"></i> Library</a>
        <button id="theme-toggle" aria-label="Toggle Dark Mode">
            <i data-lucide="moon" id="theme-icon"></i>
        </button>
    </div>
</nav>

<main class="container">
    <section class="card library-card">
        <div class="library-header-row">
            <div class="library-title-group">
                <h2 class="card-title library-title">Your Library</h2>
                <p id="item-count" class="item-count">0 items</p>
            </div>
        </div>

        <div class="search-bar">
            <i data-lucide="search" class="search-icon"></i>
            <input type="text" id="search-input" placeholder="Search your library...">
        </div>

        <div class="table-container">
            <div id="empty-state" class="empty-state">
                <i data-lucide="file-x-2" class="empty-icon"></i>
                <p>No documents uploaded yet. Upload your first document to get started.</p>
            </div>

            <table id="library-table" class="hidden">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th>Size</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="library-body">
                </tbody>
            </table>
        </div>
    </section>
</main>

<div id="edit-modal" class="modal hidden">
    <div class="modal-content card">
        <h3 class="card-title modal-title">
            <i data-lucide="pencil" class="modal-icon"></i> Edit Content Name
        </h3>
        <input type="text" id="edit-name-input" placeholder="Enter new name...">
        <div class="modal-actions">
            <button id="cancel-edit-btn" class="btn-secondary">Cancel</button>
            <button id="save-edit-btn" class="btn-primary">Save Changes</button>
        </div>
    </div>
</div>

<div id="delete-modal" class="modal hidden">
    <div class="modal-content card">
        <h3 class="card-title text-destructive modal-title">
            <i data-lucide="alert-triangle" class="modal-icon"></i> Delete Content
        </h3>
        <p>Are you sure you want to delete "<strong id="delete-item-name"></strong>"? This cannot be undone.</p>
        <div class="modal-actions">
            <button id="cancel-delete-btn" class="btn-secondary">Cancel</button>
            <button id="confirm-delete-btn" class="btn-destructive">Delete</button>
        </div>
    </div>
</div>

<script src="../js/common.js"></script>
<script src="../js/library.js"></script>
</body>
</html>
