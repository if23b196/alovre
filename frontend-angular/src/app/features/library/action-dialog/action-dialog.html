<div *transloco="let t" class="dialog-container">
  <h2 mat-dialog-title class="dialog-title" [class.text-destructive]="data.mode === 'delete'">
    <mat-icon>
      {{ data.mode === 'edit' ? 'edit' : 'warning' }}
    </mat-icon>
    <span>{{ data.title }}</span>
  </h2>

  <mat-dialog-content class="dialog-content">
    @if (data.mode === 'edit') {
      <mat-form-field appearance="outline" class="full-width">
        <input
          matInput
          cdkFocusInitial
          [(ngModel)]="value"
          [placeholder]="data.placeholder || ''"
          (keydown.enter)="confirm()"
        />
      </mat-form-field>
    } @else {
      <p class="dialog-message">{{ data.message }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close class="btn-cancel">{{ t('library.btnCancel') }}</button>
    <button
      mat-flat-button
      [class.btn-destructive]="data.mode === 'delete'"
      [class.btn-primary]="data.mode !== 'delete'"
      [disabled]="data.mode === 'edit' && !value().trim()"
      (click)="confirm()"
    >
      {{ data.confirmText }}
    </button>
  </mat-dialog-actions>
</div>
